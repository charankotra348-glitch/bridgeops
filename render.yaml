# Render Blueprint: one free web service built from ./Dockerfile.
# The database is external (a free Neon Postgres), because Render deletes free databases
# after 30 days. Secrets marked sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: bridgeops
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy a commit only after CI passes
    envVars:
      - key: DATABASE_URL           # Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: ADMIN_EMAIL            # first account, created on the first start
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HUBSPOT_TOKEN          # private app token from the HubSpot TEST account
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DECISION_PROVIDER
        value: gemini
      - key: COOKIE_SECURE
        value: "true"
