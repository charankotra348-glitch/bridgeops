name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  api-postgres:
    # The deployment runs on Postgres; the same suite runs against it here.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridgeops
          POSTGRES_PASSWORD: bridgeops
          POSTGRES_DB: bridgeops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bridgeops" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bridgeops:bridgeops@localhost:5432/bridgeops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test on Postgres
        run: pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r api/requirements.txt
      - name: Run rules-baseline eval (fails if precision drops below floor)
        run: python eval/run_eval.py --provider rules --min-precision 0.95

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (docker compose)
        run: docker build -t bridgeops-api ./api
      - name: Build production image (API + UI)
        run: docker build -t bridgeops .
      - name: Smoke-test the production image
        run: |
          docker run -d --name app -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/smoke.db bridgeops
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q "<title>BridgeOps</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/jobs)" = 401
          docker logs app | tail -5

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
